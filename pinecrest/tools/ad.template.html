<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Pinecrest Roofing Ad</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; font-weight: 900; src: url("vendor/montserrat-latin-900-normal.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-weight: 800; src: url("vendor/montserrat-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 600; src: url("vendor/inter-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 800; src: url("vendor/inter-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "Noto Color Emoji"; src: url("vendor/NotoColorEmoji.ttf") format("truetype"); }
      body { margin: 0; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff;
              font-family: "Montserrat", "Noto Color Emoji", sans-serif; font-weight: 900; }
      .emo { font-family: "Noto Color Emoji", sans-serif; }

      /* Footage: untimed Ken Burns wrapper > snap-zoom wrapper > timed media */
      .kb, .shot { position: absolute; inset: 0; overflow: hidden; }
      .kb { transform-origin: 50% 45%; }
      .snap { position: absolute; inset: 0; transform-origin: 50% 45%; }
      .media { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
      .bright .media { filter: brightness(1.12) saturate(1.08); }
      .leak { position: absolute; inset: 0; mix-blend-mode: screen; opacity: 0; pointer-events: none; }
      #flash { position: absolute; inset: 0; background: #fff6e0; opacity: 0; pointer-events: none; }

      /* Text pops, top third */
      .pop { position: absolute; left: 0; right: 0; top: 260px; height: 220px; display: flex; align-items: center; justify-content: center; }
      .pill { display: block; padding: 22px 38px 18px; border-radius: 22px; background: #fff; color: #111; font-size: 60px; letter-spacing: -0.5px;
              box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45); white-space: nowrap; }
      .pill.big { background: #ffd60a; font-size: 120px; padding: 18px 46px 12px; }
      .pill.green { background: #16a34a; color: #fff; }
      .pill.red { background: #dc2626; color: #fff; }

      /* Pinecrest title with light sweep */
      .brand { position: absolute; left: 0; right: 0; top: 230px; height: 300px; display: flex; align-items: center; justify-content: center; }
      .brandin { position: relative; overflow: hidden; padding: 26px 46px 30px; border-radius: 22px; background: rgba(10, 10, 10, 0.55);
                 border: 2px solid rgba(214, 178, 94, 0.8); text-align: center; }
      .b1 { font-size: 112px; letter-spacing: 6px; color: #f3d48a; line-height: 1; }
      .b2 { margin-top: 10px; font-family: "Inter", sans-serif; font-weight: 800; font-size: 40px; letter-spacing: 8px; }
      #sweep { position: absolute; top: -20%; bottom: -20%; left: 0; width: 34%;
               background: linear-gradient(100deg, rgba(255, 255, 255, 0) 0%, rgba(255, 245, 210, 0.75) 50%, rgba(255, 255, 255, 0) 100%); }

      /* End card */
      .endcard { position: absolute; inset: 0; }
      .ecbg { position: absolute; inset: 0; background: linear-gradient(rgba(8, 6, 4, 0.35), rgba(8, 6, 4, 0.82) 55%); }
      .ecname { position: absolute; left: 0; right: 0; top: 330px; text-align: center; font-size: 140px; letter-spacing: 6px; color: #f3d48a; line-height: 1; }
      .ecname span { display: block; margin-top: 18px; font-family: "Inter", sans-serif; font-weight: 800; font-size: 46px; letter-spacing: 9px; color: #fff; }
      .ecbtn { position: absolute; left: 90px; right: 90px; top: 720px; padding: 40px 30px 34px; border-radius: 30px; background: #e3121e;
               text-align: center; font-size: 66px; line-height: 1.12; box-shadow: 0 14px 0 #7a0000, 0 20px 50px rgba(227, 18, 30, 0.45); }
      .ecsub { position: absolute; left: 0; right: 0; top: 1010px; text-align: center; font-family: "Inter", sans-serif; font-weight: 600; font-size: 40px;
               color: rgba(255, 255, 255, 0.85); }

      /* Captions: lower third, bold white, thick black outline, word-by-word highlight */
      #captions { position: absolute; left: 0; right: 0; top: 1300px; height: 280px; }
      .cg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; }
      .cg .line { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 46px; max-width: 1000px; }
      .w { display: inline-block; font-size: 104px; line-height: 1.1; color: #fff; -webkit-text-stroke: 16px #000; paint-order: stroke fill;
           text-shadow: 0 8px 0 #000, 0 10px 24px rgba(0, 0, 0, 0.5); opacity: 0.6; }

      #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 80% 65% at 50% 45%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.45) 100%); }
      #grain { position: absolute; inset: 0; pointer-events: none; opacity: 0.08; mix-blend-mode: overlay; background-image: url("assets/grain.png"); background-size: 1024px 1024px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="{{DUR}}">
      {{ELEMENTS}}
      <div id="flash"></div>
      <div id="vignette"></div>
      <div id="captions" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="30">
        {{CAPTIONS}}
      </div>
      <div id="grain"></div>
    </div>
    <audio id="vo" src="assets/vo_tight.wav" data-start="0" data-duration="{{VO_DUR}}" data-track-index="0" data-volume="1"></audio>
    <audio id="music" src="assets/music.wav" data-start="0" data-duration="{{DUR}}" data-track-index="1" data-volume="0.14"></audio>
    {{AUDIO}}
    <script>
      const tl = gsap.timeline({ paused: true });
      {{JS}}
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
