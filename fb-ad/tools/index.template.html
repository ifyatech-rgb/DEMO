<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Roofing Leads Facebook Ad</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Montserrat";
        font-weight: 900;
        src: url("vendor/montserrat-latin-900-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Montserrat";
        font-weight: 800;
        src: url("vendor/montserrat-latin-800-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Noto Color Emoji";
        src: url("vendor/NotoColorEmoji.ttf") format("truetype");
      }
      body {
        margin: 0;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Montserrat", "Noto Color Emoji", sans-serif;
      }
      #cam {
        position: absolute;
        inset: 0;
        transform-origin: 50% 32%;
      }
      #aroll {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* Captions: lower middle, below the chin line (~1080px). */
      #captions {
        position: absolute;
        left: 0;
        right: 0;
        top: 1170px;
        height: 300px;
      }
      .cg {
        position: absolute;
        inset: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        align-content: center;
        justify-content: center;
        gap: 0 38px;
        padding: 0 60px;
        opacity: 0;
      }
      .w {
        display: inline-block;
        font-size: 104px;
        line-height: 1.12;
        font-weight: 900;
        color: #fff;
        -webkit-text-stroke: 16px #000;
        paint-order: stroke fill;
        text-shadow: 0 8px 0 #000, 0 10px 18px rgba(0, 0, 0, 0.55);
        opacity: 0.55;
      }
      .pop {
        position: absolute;
        left: 0;
        right: 0;
        top: 110px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .pill {
        display: block;
        padding: 16px 34px 14px;
        border-radius: 18px;
        background: #ffd60a;
        color: #000;
        font-size: 58px;
        font-weight: 900;
        letter-spacing: 1px;
        border: 5px solid #000;
        box-shadow: 0 10px 0 #000;
      }
      #cta {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 150px;
        height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #cta-box {
        display: block;
        max-width: 920px;
        padding: 26px 40px 22px;
        border-radius: 26px;
        background: #e3121e;
        color: #fff;
        font-size: 60px;
        line-height: 1.15;
        font-weight: 900;
        text-align: center;
        border: 6px solid #000;
        box-shadow: 0 12px 0 #000;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="{{DUR}}"
    >
      <div id="cam">
        <video
          id="aroll"
          class="clip"
          src="assets/cut.mp4"
          playsinline
          data-has-audio="true"
          data-start="0"
          data-duration="{{DUR}}"
          data-track-index="0"
          data-volume="1"
        ></video>
      </div>
      <audio
        id="music"
        src="assets/music.wav"
        data-start="0"
        data-duration="{{DUR}}"
        data-track-index="1"
        data-volume="0.1"
      ></audio>
      <div id="captions" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="2">
{{CAPTIONS}}
      </div>
{{POPS}}
      <div id="cta" class="clip" data-start="{{CTA_START}}" data-duration="{{CTA_DUR}}" data-track-index="3">
        <span id="cta-box">CHECK IF YOUR AREA IS AVAILABLE 👇</span>
      </div>
    </div>
    <script>
      const DATA = {{DATA}};
      const tl = gsap.timeline({ paused: true });

      // Word-by-word captions: group pops in, each word lights up and punches as it is spoken.
      DATA.groups.forEach(function (g, gi) {
        const el = document.getElementById("cg-" + gi);
        tl.fromTo(el, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.12, ease: "back.out(2)" }, g.start);
        g.words.forEach(function (wi) {
          const w = DATA.words[wi];
          const node = document.getElementById("w" + wi);
          const lit = { opacity: 1, scale: 1.1, duration: 0.08, ease: "power2.out" };
          if (node.classList.contains("hl")) lit.color = "#ffd60a"; // keywords turn yellow as they are spoken
          tl.fromTo(node, { opacity: 0.55, scale: 1, color: "#ffffff" }, lit, w.start);
          tl.to(node, { scale: 1, duration: 0.12, ease: "power2.out" }, Math.max(w.start + 0.08, w.end));
        });
        tl.to(el, { opacity: 0, duration: 0.06, ease: "power2.in" }, g.end - 0.06);
        tl.set(el, { opacity: 0, visibility: "hidden" }, g.end);
      });

      // Punch-in zooms on the key lines (~113%), then back out.
      DATA.zooms.forEach(function (z, zi) {
        const next = DATA.zooms[zi + 1];
        tl.fromTo("#cam", { scale: 1 }, { scale: 1.13, duration: 0.16, ease: "power3.out", immediateRender: false }, z[0]);
        if (next && next[0] - z[1] < 0.4) {
          tl.set("#cam", { scale: 1 }, next[0] - 0.001); // back-to-back lines: snap out, punch in again
        } else {
          tl.to("#cam", { scale: 1, duration: 0.28, ease: "power2.inOut" }, z[1] + 0.05);
        }
      });

      // Top-of-frame text pop-ups.
      for (let k = 0; k < DATA.pops; k++) {
        const clip = document.getElementById("pop-" + k);
        const s = parseFloat(clip.dataset.start);
        const e = s + parseFloat(clip.dataset.duration);
        tl.fromTo("#pill-" + k, { opacity: 0, scale: 0.5, y: -30 }, { opacity: 1, scale: 1, y: 0, duration: 0.25, ease: "back.out(2.5)" }, s);
        if (e < {{DUR}} - 0.1) tl.to("#pill-" + k, { opacity: 0, scale: 0.9, duration: 0.15, ease: "power2.in" }, e - 0.15);
      }

      // End-card call to action.
      tl.fromTo("#cta-box", { opacity: 0, y: 80, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "back.out(2)" }, {{CTA_START}});
      tl.to("#cta-box", { scale: 1.05, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 5 }, {{CTA_START}} + 0.4);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
