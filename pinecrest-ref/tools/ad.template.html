<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Pinecrest Reference Cut</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Anton"; font-weight: 400; src: url("vendor/anton-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 600; src: url("vendor/inter-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 700; src: url("vendor/inter-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 800; src: url("vendor/inter-latin-800-normal.woff2") format("woff2"); }
      body { margin: 0; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: "Inter", sans-serif; }

      /* Presenter: punch levels on #cam, bloom/blur settle on #settle */
      #cam, #settle { position: absolute; inset: 0; transform-origin: 50% 24%; }
      #aroll { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #bloom { position: absolute; inset: 0; background: #f4f1ea; opacity: 0; pointer-events: none; }

      /* B-roll, moody grade like the reference */
      .kb, .shot { position: absolute; inset: 0; overflow: hidden; }
      .kb { transform-origin: 50% 45%; }
      .snap { position: absolute; inset: 0; transform-origin: 50% 45%; }
      .media { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; filter: brightness(0.84) contrast(1.12) saturate(0.78); }
      .bright .media { filter: brightness(0.95) contrast(1.06) saturate(0.9); }

      /* Kinetic opener: condensed caps, white + blue, tight stack on the chest */
      .kin { position: absolute; left: 60px; right: 60px; top: 780px; height: 560px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .krow { display: flex; align-items: flex-end; justify-content: center; gap: 0 18px; line-height: 0.92; }
      .kw { display: inline-block; font-family: "Anton", sans-serif; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0;
            text-shadow: 0 4px 14px rgba(0, 0, 0, 0.45); }
      .kw.b { color: #24a8e0; }
      .kw.w { color: #fff; }

      /* Pinned offer seal */
      .seal { position: absolute; left: 92px; top: 112px; width: 232px; height: 232px; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.35)); }
      .seal .arc { font-family: "Inter", sans-serif; font-weight: 800; font-size: 19px; letter-spacing: 2px; fill: #0f2a44; }
      .seal .sbig { font-family: "Anton", sans-serif; font-size: 52px; fill: #16a34a; }
      .seal .ssmall { font-family: "Inter", sans-serif; font-weight: 800; font-size: 19px; letter-spacing: 1px; fill: #16a34a; }

      /* Inspection report page stack */
      .report { position: absolute; inset: 0; overflow: hidden; }
      .rbg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, #f7f7f5, #cfd2d4 75%); }
      .rpage { position: absolute; left: 120px; top: 360px; width: 840px; height: 1060px; background: #fff; border-radius: 6px; opacity: 0;
               box-shadow: 0 30px 60px rgba(0, 0, 0, 0.28), 0 2px 6px rgba(0, 0, 0, 0.2); padding: 36px 34px; box-sizing: border-box; color: #1f2937; }
      .rhead { font-family: "Inter", sans-serif; font-weight: 800; font-size: 30px; letter-spacing: 2px; border-bottom: 3px solid #0f2a44; padding-bottom: 12px; margin-bottom: 22px; }
      .rhead b { display: block; margin-top: 6px; font-weight: 600; font-size: 28px; letter-spacing: 0; color: #6b7280; }
      .rgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      .rcell { position: relative; height: 410px; overflow: hidden; border-radius: 4px; background: #e5e7eb; }
      .rcell img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .rcell span { position: absolute; left: 12px; bottom: 12px; right: 12px; font-weight: 700; font-size: 28px; color: #d9f99d;
                    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9); }

      /* Captions: small sentence-case white on black tags, lower middle */
      #captions { position: absolute; left: 0; right: 0; top: 1330px; height: 80px; }
      .cg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; }
      .tag { display: inline-block; padding: 10px 22px 12px; border-radius: 12px; background: rgba(8, 8, 8, 0.88); font-weight: 600; font-size: 46px;
             line-height: 1.15; white-space: nowrap; }
      .booknow { position: absolute; left: 0; right: 0; top: 1430px; height: 90px; display: flex; align-items: center; justify-content: center; }
      #bn { display: inline-block; padding: 14px 64px 16px; border-radius: 999px; background: #fff; color: #e3121e; font-weight: 800; font-style: italic;
            font-size: 44px; letter-spacing: 1px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="{{DUR}}">
      <div id="cam"><div id="settle">
        <video id="aroll" class="clip" src="assets/aroll.mp4" playsinline data-has-audio="true" data-start="0" data-duration="{{DUR}}" data-track-index="0" data-volume="1"></video>
      </div></div>
      {{ELEMENTS}}
      <div id="bloom"></div>
      <div id="captions" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="30">
        {{CAPTIONS}}
      </div>
    </div>
    <audio id="music" src="assets/music.wav" data-start="0" data-duration="{{DUR}}" data-track-index="1" data-volume="0.12"></audio>
    {{AUDIO}}
    <script>
      const tl = gsap.timeline({ paused: true });
      {{JS}}
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
